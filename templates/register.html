{% extends "base.html" %}
{% block title %}Register — CowCareAI{% endblock %}

{% block unauth_content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.1), transparent); padding: 20px;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 40px 32px; box-shadow: var(--shadow-md); border-color: var(--border-color);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-logo" style="width: 52px; height: 52px; font-size: 26px; margin: 0 auto 16px auto;">
        <i class="fas fa-brain"></i>
      </div>
      <h2 style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Register Operator Account</h2>
      <p style="font-size: 13px; color: var(--text-secondary);">Join CowCareAI Livestock Intelligence</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Username</label>
        <input type="text" name="username" required placeholder="Choose username" style="width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Email Address</label>
        <input type="email" name="email" required placeholder="operator@farm.com" style="width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Password</label>
        <input type="password" name="password" required placeholder="Create password" style="width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px;">
      </div>

      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Confirm Password</label>
        <input type="password" name="confirm" required placeholder="Confirm password" style="width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px;">
      </div>

      <button type="submit" class="btn-new-session" style="width: 100%; justify-content: center; padding: 13px; font-size: 15px;">
        Create Account <i class="fas fa-user-plus"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('login') }}" style="color: var(--accent-blue); font-weight: 600; text-decoration: none;">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
